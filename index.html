    <style>
      /* Critical CSS — keeps first paint dark and shows the preloader before JS loads. */
      html { background: #090c13; }
      body { margin: 0; }
      #preloader {
        position: fixed; inset: 0; z-index: 9999; display: grid; place-items: center;
        background: #090c13; transition: opacity .45s ease, visibility .45s ease;
      }
      #preloader.is-hidden { opacity: 0; visibility: hidden; }
      #preloader .pl-mark { width: 64px; height: 64px; }
      #preloader .pl-stroke {
        fill: none; stroke: #22d3ee; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round;
        stroke-dasharray: 160; stroke-dashoffset: 160; animation: pl-draw 1.1s cubic-bezier(.65,0,.35,1) forwards;
      }
      #preloader .pl-bar { width: 96px; height: 2px; margin-top: 18px; border-radius: 2px; background: rgba(148,163,184,.15); overflow: hidden; }
      #preloader .pl-bar::after {
        content: ""; display: block; height: 100%; width: 40%; background: linear-gradient(90deg, #22d3ee, #3b82f6);
        animation: pl-slide 1s ease-in-out infinite;
      }
      @keyframes pl-draw { to { stroke-dashoffset: 0; } }
      @keyframes pl-slide { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
      @media (prefers-reduced-motion: reduce) {
        #preloader .pl-stroke { animation: none; stroke-dashoffset: 0; }
        #preloader .pl-bar::after { animation: none; width: 100%; }
      }
    </style>
  </head>
